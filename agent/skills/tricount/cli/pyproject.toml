[project]
name = "tricount-cli"
version = "0.1.0"
description = "Tricount CLI for vesta — list expenses, balances, add expenses"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.scripts]
tricount = "tricount_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

# This project declares no build backend, so uv does not install it into the test
# venv; point pytest at the sources instead of changing how the skill installs.
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/tricount_cli"]
