[project]
name = "upstream"
version = "0.1.0"
description = "Push contributions to the upstream vesta repo via the vesta-upstream GitHub App"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
]

[project.scripts]
upstream = "upstream_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/upstream_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
