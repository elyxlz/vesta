[project]
name = "voice"
version = "0.1.0"
description = "Voice engine, STT/TTS/judge providers, and the voice command for the agent"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
]

[project.scripts]
voice = "voice.cli:main"
transcribe = "voice.transcribe:main"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
