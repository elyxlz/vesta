[project]
name = "gmaps-cli"
version = "0.1.0"
description = "Google Maps CLI for vesta — search places, links, directions, itineraries"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
maps = "gmaps_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gmaps_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/gmaps_cli/search_pb.txt" = "gmaps_cli/search_pb.txt"
"src/gmaps_cli/directions_pb.txt" = "gmaps_cli/directions_pb.txt"
"src/gmaps_cli/transit_pb.txt" = "gmaps_cli/transit_pb.txt"
"src/gmaps_cli/place_pb.txt" = "gmaps_cli/place_pb.txt"
"src/gmaps_cli/reverse_pb.txt" = "gmaps_cli/reverse_pb.txt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
