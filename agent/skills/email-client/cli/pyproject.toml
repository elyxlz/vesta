[project]
name = "email-client"
version = "0.1.0"
description = "Multi-account IMAP/SMTP email client over OAuth2 or app passwords, with CalDAV calendar"
readme = {text = "", content-type = "text/plain"}
authors = [
    { name = "elyxlz" }
]
requires-python = ">=3.11"
dependencies = [
    "imap_tools>=1.5",
    "msal>=1.28",
]

[project.scripts]
email-client = "email_client.imap:main"
email-client-send = "email_client.smtp:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/email_client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
