[project]
name = "reminders"
version = "0.1.0"
description = "Reminders CLI: time-based nudges on one-shot, recurring, and cron schedules"
readme = {text = "", content-type = "text/plain"}
authors = [
    { name = "elyxlz" }
]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
remind = "reminders_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reminders_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
