[project]
name = "vesta"
version = "0.3.23"
description = "AI guardian angel that works autonomously on your behalf"
license = "MIT"
authors = [
    { name = "elyxlz" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "claude-agent-sdk>=0.2.175",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "watchfiles>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/elyxlz/vesta"
Repository = "https://github.com/elyxlz/vesta"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.170.14",
    "ty>=0.0.95",
]
