[project]
name = "vesta"
version = "0.2.11"
description = "AI guardian angel that works autonomously on your behalf"
license = "MIT"
authors = [
    { name = "elyxlz" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "claude-agent-sdk>=0.2.138",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "watchfiles>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/elyxlz/vesta"
Repository = "https://github.com/elyxlz/vesta"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.165.8",
    "ty>=0.0.71",
]
