name: Promote

# Promote a beta (prerelease) to stable. Every ./release.sh ships a prerelease that
# only opted-in beta clients follow; this workflow does the stable half once the beta
# has soaked: move the agent image :latest tag, flip the GitHub release to latest, and
# advance the production branch. No rebuild happens here, the exact artifacts that beta
# users tested become stable. Promotion also cascades: every non-draft prerelease older
# than the target is flipped to stable too (never marked latest), so no beta is ever
# left behind below the new stable. A second job then sends the iOS build that TestFlight
# already holds for the target to App Store review; Apple releases it on approval.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote (e.g. v0.1.156)"
        type: string
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Release · Promote to stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate tag is an existing prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag must look like vX.Y.Z (got '$TAG')"; exit 1 ;;
          esac
          IS_PRERELEASE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::$TAG is not a prerelease (already promoted, or does not exist)"
            exit 1
          fi
          echo "✓ $TAG is a prerelease, promoting to stable"

      # Cascade: flip every non-draft prerelease older than the target to stable,
      # oldest first, so no beta lingers as a prerelease below the new stable. Only
      # the target (below) gets --latest, the :latest image move, and the production
      # push; cascaded releases are explicitly not marked latest.
      - name: Promote older prereleases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          RELEASE_LIST_LIMIT=100
          TARGET_VERSION="${TAG#v}"
          PRERELEASE_TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit "$RELEASE_LIST_LIMIT" \
            --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isPrerelease and (.isDraft | not)) | .tagName')
          for OLDER_TAG in $(printf '%s\n' "$PRERELEASE_TAGS" | sort -V); do
            OLDER_VERSION="${OLDER_TAG#v}"
            if [ "$OLDER_VERSION" = "$TARGET_VERSION" ]; then
              continue
            fi
            NEWEST=$(printf '%s\n%s\n' "$OLDER_VERSION" "$TARGET_VERSION" | sort -V | tail -n 1)
            if [ "$NEWEST" != "$TARGET_VERSION" ]; then
              continue
            fi
            echo "Cascading: flipping older beta $OLDER_TAG to stable"
            gh release edit "$OLDER_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest=false
          done

      # Full history: the production push is a force-push of the tag's commit, and a
      # shallow checkout can be rejected with "shallow update not allowed".
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-point :latest at the already-pushed :vX.Y.Z digest without rebuilding.
      # imagetools preserves the multi-arch manifest list.
      - name: Move :latest to the promoted image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            "ghcr.io/${GITHUB_REPOSITORY}:${TAG}"

      - name: Flip GitHub release to stable
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "✓ $TAG is now the latest stable release"

      # Stable desktop/CLI/vestad now see this version via releases/latest. Advance
      # production to the promoted commit (this is what stable clients track).
      - name: Advance production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:production
          echo "✓ production advanced to ${{ inputs.tag }}"

  # A separate job, so a failed submission never undoes the promotion and "Re-run failed
  # jobs" retries the submission alone. Only the target is submitted: cascaded betas are
  # older, and the store takes one version at a time.
  app-store:
    name: Mobile · Submit iOS to App Store review
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The default branch, not the tag: this job runs release tooling and no app code,
      # so a tag older than the tooling still promotes.
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane -v "$FASTLANE_VERSION" --no-document
        env:
          FASTLANE_VERSION: 2.241.2

      - name: Submit the TestFlight build for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TAG: ${{ inputs.tag }}
        run: ./apps/mobile/scripts/submit-app-store.sh "$TAG"
