name: "Install Rust"
description: "Install the Rust toolchain vestad/rust-toolchain.toml pins, retrying on transient rustup network failures"

inputs:
  targets:
    description: "Comma- or space-separated target triples to add"
    required: false
    default: ""
  components:
    description: "Comma- or space-separated components to add (e.g. clippy)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # dtolnay/rust-toolchain has no retry, so a single transient rustup download
    # blip fails the whole job. rustup is preinstalled on every GitHub runner, so
    # we drive it directly and retry with backoff. The version comes from the pin file, the
    # one owner local cargo reads too, so CI never moves to a new Rust on its own.
    - shell: bash
      env:
        RUST_TARGETS: ${{ inputs.targets }}
        RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' vestad/rust-toolchain.toml)"
        [ -n "$channel" ] || { echo "::error::no channel in vestad/rust-toolchain.toml"; exit 1; }
        args=("$channel" --profile minimal --no-self-update)
        for target in ${RUST_TARGETS//,/ }; do args+=(--target "$target"); done
        for component in ${RUST_COMPONENTS//,/ }; do args+=(--component "$component"); done
        for attempt in 1 2 3; do
          if rustup toolchain install "${args[@]}"; then
            rustup default "$channel"
            exit 0
          fi
          delay=$((attempt * 10))
          echo "::warning::rustup install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "${delay}"
        done
        echo "::error::rustup install failed after 3 attempts"
        exit 1
