appId: com.vesta.desktop
productName: Vesta
artifactName: "Vesta_${version}_${arch}.${ext}"
directories:
  output: dist
files:
  - dist-electron/**
  - "!dist-electron/**/*.test.js"
  - package.json
extraResources:
  - from: ../web/dist
    to: web
beforePack: scripts/build-native.mjs
mac:
  extraResources:
    - from: native/vesta-location
      to: vesta-location
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Vesta uses your microphone for voice input to your agent.
    NSLocationWhenInUseUsageDescription: Vesta shares this device's location with your agents so they follow your travel.
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  category: Utility
  target:
    - deb
    - rpm
publish:
  provider: generic
  url: "https://github.com/elyxlz/vesta/releases/download/v${version}"
