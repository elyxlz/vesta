appId: ${APP_ID}
name: Connected release notes error state
tags:
  - visual
  - connected
---
- runFlow: prepare-page.yml
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualReleaseNotes=error"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 30000
- openLink:
    link: "vesta-dev://whats-new?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualReleaseNotes=error"
- runFlow: wait-for-launch.yml
- takeScreenshot: whats-new-error
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: whats-new-error.png

- stopApp
- openLink:
    link: "vesta-dev://agent/aria/settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualServices=voice"
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: '.*Provider and model.*'
    timeout: 30000
- tapOn:
    text: "^Provider and model.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-provider
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-provider.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualServices=voice"
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: '.*Provider and model.*'
    timeout: 30000
- tapOn:
    text: "^Voice.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-voice
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-voice.png

- stopApp
- openLink:
    link: "vesta-dev://debug?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: diagnostics
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: diagnostics.png
