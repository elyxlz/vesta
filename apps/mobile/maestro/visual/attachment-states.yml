appId: ${APP_ID}
name: Attachment states
tags:
  - visual
  - connected
---
- runFlow: prepare-page.yml
- setPermissions:
    permissions:
      camera: allow
      photos: allow
- openLink:
    link: "vesta-dev://agent/aria?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: ".*Add attachment.*"
    timeout: 30000
- tapOn:
    text: "Add attachment"
- takeScreenshot: agent-chat-attach-sheet
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-attach-sheet.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualAttachments=chips"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-chat-attachment-chips
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-attachment-chips.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualAttachments=uploading"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-chat-attachment-chips-uploading
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-attachment-chips-uploading.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualAttachments=waiting"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-chat-attachment-chips-waiting
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-attachment-chips-waiting.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualChat=attachments"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-chat-attachments
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-attachments.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualChat=attachments-degraded"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-chat-attachments-degraded
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-attachments-degraded.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualChat=attachments"
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: ".*View sunset.jpg.*"
    timeout: 30000
- tapOn:
    text: "View sunset.jpg"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-chat-attachment-viewer
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-attachment-viewer.png
- doubleTapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-chat-attachment-viewer-zoomed
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-attachment-viewer-zoomed.png
- stopApp
