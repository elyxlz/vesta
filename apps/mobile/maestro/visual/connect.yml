appId: ${APP_ID}
name: Connection actions and link
tags:
  - visual
  - onboarding
---
- clearState
- setPermissions:
    permissions:
      location: inuse
- setPermissions:
    permissions:
      camera: deny
- openLink:
    link: "vesta-dev://connect?visualPrivacy=unlocked"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- extendedWaitUntil:
    visible: "Connect with Vesta Cloud"
    timeout: 30000
- takeScreenshot: connect-actions
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: connect-actions.png

- tapOn:
    text: "Connect with Vesta Cloud"
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Sign-in failed"
    timeout: 10000
- takeScreenshot: cloud-sign-in-error
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: cloud-sign-in-error.png

- tapOn:
    text: "Connect to self-hosted Vesta"
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Connect your gateway"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Connection link"
- waitForAnimationToEnd:
    timeout: 3000
- runScript:
    file: capture-screenshot.js
    env:
      ACTION: show-software-keyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: connect-link
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: connect-link.png

- setPermissions:
    permissions:
      camera: deny
- tapOn:
    text: "Scan connection QR code"
    waitToSettleTimeoutMs: 1
# iOS shows the denied recovery state directly; Android asks again through the
# system dialog, and only a second denial makes the denial permanent, so deny
# until the app's recovery state appears.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ".*Open Settings"
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Don’t allow"
          waitToSettleTimeoutMs: 1
      - tapOn:
          text: "Don’t allow"
          optional: true
          waitToSettleTimeoutMs: 1
      - extendedWaitUntil:
          visible: ".*Open Settings"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
- takeScreenshot: scan-permission
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: scan-permission.png
- tapOn: "Close scanner"
- extendedWaitUntil:
    visible: "Connection link"
    timeout: 10000

- tapOn: "Connection link"
- inputText: "not-a-link"
- tapOn:
    text: "^Connect$"
    waitToSettleTimeoutMs: 1
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: connect-link-invalid
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: connect-link-invalid.png

- stopApp
- clearState
- setPermissions:
    permissions:
      location: inuse
- setPermissions:
    permissions:
      camera: allow
- openLink:
    link: "vesta-dev://connect?visualPrivacy=unlocked"
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Connect with Vesta Cloud"
    timeout: 30000
- tapOn:
    text: "Connect to self-hosted Vesta"
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Connect your gateway"
    timeout: 10000
- tapOn:
    text: "Scan connection QR code"
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Close scanner"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: scan-ready
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: scan-ready.png
