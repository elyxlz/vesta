appId: ${APP_ID}
name: Connection actions and link
tags:
  - visual
  - onboarding
---
- clearState
- setPermissions:
    permissions:
      camera: deny
- openLink:
    link: "vesta-dev://connect?visualPrivacy=unlocked"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Connect with Vesta Cloud"
    timeout: 30000
- takeScreenshot: connect-actions
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: connect-actions.png

- tapOn:
    text: "Connect with Vesta Cloud"
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Sign-in failed"
    timeout: 10000
- takeScreenshot: cloud-sign-in-error
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: cloud-sign-in-error.png

- tapOn:
    text: "Connect to self-hosted Vesta"
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Connect your gateway"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Connection link"
- waitForAnimationToEnd:
    timeout: 3000
- runScript:
    file: capture-screenshot.js
    env:
      ACTION: show-software-keyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: connect-link
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: connect-link.png

- setPermissions:
    permissions:
      camera: deny
- tapOn:
    text: "Scan connection QR code"
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*Open Settings"
    timeout: 10000
- takeScreenshot: scan-permission
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: scan-permission.png
- tapOn: "Close scanner"
- extendedWaitUntil:
    visible: "Connection link"
    timeout: 10000

- tapOn: "Connection link"
- inputText: "not-a-link"
- tapOn:
    text: "^Connect$"
    waitToSettleTimeoutMs: 1
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: connect-link-invalid
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: connect-link-invalid.png
