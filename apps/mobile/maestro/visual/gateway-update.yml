appId: ${APP_ID}
name: Gateway update screens
tags:
  - visual
  - connected
  - gateway-update
# Cover the blocking screen and the optional update in Settings.
---
- clearState
- setPermissions:
    permissions:
      location: inuse
- openLink:
    link: "vesta-dev://?visualSession=connected&visualRoster=agents&visualGatewayUpdate=required"
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- extendedWaitUntil:
    visible: "Privacy unavailable"
    timeout: 30000
- assertNotVisible: "This version of the app needs a newer gateway.*"
- stopApp
- clearState
- setPermissions:
    permissions:
      location: inuse

- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualGatewayUpdate=required"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*This version of the app needs a newer gateway.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: gateway-update-required
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: gateway-update-required.png

- tapOn:
    text: ".*Update gateway.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: gateway-update-in-progress
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: gateway-update-in-progress.png

- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualGatewayUpdate=available"
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 30000
- tapOn:
    text: "App settings.*"
- extendedWaitUntil:
    visible: "App Lock"
    timeout: 10000
- swipe:
    start: "50%,58%"
    end: "50%,10%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Close settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "^Update gateway.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- takeScreenshot: settings-gateway-update-available
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-gateway-update-available.png

- scrollUntilVisible:
    element:
      text: "^Update gateway.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true

- tapOn:
    text: "^Update gateway.*"
- extendedWaitUntil:
    visible: "Update gateway?"
    timeout: 10000
- takeScreenshot: settings-gateway-update-confirm
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-gateway-update-confirm.png

# Home while the gateway works on itself. Each phase is its own launch: the tree carries one
# operation at a time and no public action advances it.
- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualGatewayOperation=snapshotting"
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Updating to v0.2.1"
    timeout: 30000
- extendedWaitUntil:
    visible: "backing up nova 2/3"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: gateway-update-snapshotting
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: gateway-update-snapshotting.png

- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualGatewayOperation=failed"
- extendedWaitUntil:
    visible: ".*Update didn.t finish.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Try again.*"
    timeout: 10000
- assertVisible: ".*Not now.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: gateway-update-failed
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: gateway-update-failed.png

- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualGatewayOperation=restarting"
- extendedWaitUntil:
    visible: ".*Restarting gateway.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: gateway-restarting
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: gateway-restarting.png

# The moment the update ends: home reports the version it landed on before the roster returns.
- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualGatewayUpdated=0.2.1"
- extendedWaitUntil:
    visible: "Updated to v0.2.1"
    timeout: 30000
- assertVisible: ".*running the new version.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: gateway-updated
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: gateway-updated.png

# The opposite version failure: this app is below the gateway's supported window.
- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualSyncState=app_behind"
- extendedWaitUntil:
    visible: "This app is too old for the gateway.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: app-behind
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: app-behind.png
