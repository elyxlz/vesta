- runFlow: wait-for-launch.yml
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%,58%"
          end: "50%,10%"
          duration: 500
- scrollUntilVisible:
    element:
      text: '^Light$'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    text: '^Light$'
- waitForAnimationToEnd:
