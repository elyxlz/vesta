appId: ${APP_ID}
name: Settings states
tags:
  - visual
  - connected
---
- clearState
- openLink:
    link: "vesta-dev://settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: '.*Appearance.*'
    timeout: 30000
- swipe:
    start: "50%,20%"
    end: "50%,5%"
    duration: 250
- repeat:
    times: 3
    while:
      notVisible: '.*Release channel.*'
    commands:
      - swipe:
          start: "50%,85%"
          end: "50%,25%"
          duration: 400
      - extendedWaitUntil:
          visible: '.*Release channel.*'
          timeout: 4000
          optional: true
- tapOn:
    text: '^Release channel,.*'
- extendedWaitUntil:
    visible: '.*Release channel.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: settings-channel-picker
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-channel-picker.png
- stopApp
- openLink:
    link: "vesta-dev://settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- extendedWaitUntil:
    visible: '.*Appearance.*'
    timeout: 30000
- swipe:
