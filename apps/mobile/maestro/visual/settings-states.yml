appId: ${APP_ID}
name: Settings states
tags:
  - visual
  - connected
---
- runFlow: prepare-page.yml
- openLink:
    link: "vesta-dev://settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- runFlow: wait-for-launch.yml
- swipe:
    start: "50%,20%"
    end: "50%,5%"
    duration: 250
- repeat:
    times: 3
    while:
      notVisible: '.*Release channel.*'
    commands:
      - swipe:
          start: "50%,85%"
          end: "50%,25%"
          duration: 400
      - extendedWaitUntil:
          visible: '.*Release channel.*'
          timeout: 4000
          optional: true
- tapOn:
    text: '^Release channel.*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: settings-channel-picker
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-channel-picker.png
- stopApp
- openLink:
    link: "vesta-dev://settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- swipe:
    start: "50%,20%"
    end: "50%,5%"
    duration: 250
- repeat:
    times: 3
    while:
      notVisible: '.*Restart gateway.*'
    commands:
      - swipe:
          start: "50%,85%"
          end: "50%,25%"
          duration: 400
      - extendedWaitUntil:
          visible: '.*Restart gateway.*'
          timeout: 4000
          optional: true
- tapOn:
    text: '.*Restart gateway.*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: settings-restart-confirm
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-restart-confirm.png
- stopApp
