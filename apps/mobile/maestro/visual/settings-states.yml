          duration: 400
      - extendedWaitUntil:
          visible: '.*Allow notifications.*'
          timeout: 4000
          optional: true
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "^1$"
          rightOf:
            text: '.*Allow notifications.*'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          rightOf:
            text: '.*Allow notifications.*'
          above:
            text: '.*Chat replies.*'
