- runFlow: wait-for-launch.yml
- swipe:
    start: "50%,20%"
    end: "50%,5%"
    duration: 250
- repeat:
    times: 3
    while:
      notVisible: '.*Allow notifications.*'
    commands:
      - swipe:
          start: "50%,85%"
          end: "50%,25%"
          duration: 400
      - extendedWaitUntil:
          visible: '.*Allow notifications.*'
          timeout: 4000
          optional: true
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "^1$"
          rightOf:
            text: '.*Allow notifications.*'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          rightOf:
            text: '.*Allow notifications.*'
          above:
            text: '.*Chat replies.*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: settings-notifications-off
- runScript:
