- stopApp
- openLink:
    link: "vesta-dev://agent/aria/details/provider?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualDelay=60000"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-provider-loading
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-provider-loading.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/details/provider?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualApi=error"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-provider-error
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-provider-error.png
