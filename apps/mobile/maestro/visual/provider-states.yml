    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-provider-loading
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-provider-loading.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/details/provider?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualApi=error"
- extendedWaitUntil:
