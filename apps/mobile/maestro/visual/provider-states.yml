- takeScreenshot: agent-provider-sign-out-confirm
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-provider-sign-out-confirm.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/details/provider?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualDelay=60000"
- extendedWaitUntil:
