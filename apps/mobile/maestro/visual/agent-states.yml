- extendedWaitUntil:
    visible: '.*Natural chat pacing.*'
    timeout: 30000
- swipe:
    start: "50%,20%"
    end: "50%,5%"
    duration: 250
- scrollUntilVisible:
    element:
      text: '.*Start agent.*'
    direction: DOWN
    timeout: 15000
    speed: 40
    visibilityPercentage: 60
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-settings-stopped
- runScript:
