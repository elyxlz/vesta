appId: ${APP_ID}
name: Agent states
tags:
  - visual
  - connected
---
- clearState
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualAgent=starting"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: '.*Open aria.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: home-agent-starting
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: home-agent-starting.png
- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualAgent=setting_up"
