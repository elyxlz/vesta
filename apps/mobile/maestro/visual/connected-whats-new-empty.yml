appId: ${APP_ID}
name: Connected release notes empty state
tags:
  - visual
  - connected
---
- clearState
- setPermissions:
    permissions:
      location: inuse
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualReleaseNotes=empty"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 30000
- openLink:
    link: "vesta-dev://whats-new?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualReleaseNotes=empty"
- extendedWaitUntil:
    visible: "Nothing new yet"
    timeout: 30000
- takeScreenshot: whats-new-empty
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: whats-new-empty.png

- stopApp
- openLink:
    link: "vesta-dev://agent/aria/settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- extendedWaitUntil:
    visible: '.*Provider and model.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "^Notifications.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true

- tapOn:
    text: "^Notifications.*"
- extendedWaitUntil:
    visible: ".*Design review.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*interrupted.*"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-notification-rules
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-notification-rules.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- extendedWaitUntil:
    visible: '.*Provider and model.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "^Host access.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true

- tapOn:
    text: "^Host access.*"
- extendedWaitUntil:
    visible: "Shared folders"
    timeout: 10000
- extendedWaitUntil:
    visible: "vesta"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-host-access
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-host-access.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- extendedWaitUntil:
    visible: '.*Provider and model.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "^Files.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true

- tapOn:
    text: "^Files.*"
- extendedWaitUntil:
    visible: "Who aria is"
    timeout: 10000
- tapOn:
    text: ".*Memory.*"
- extendedWaitUntil:
    visible: "Contents of MEMORY.md"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-file-editor
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-file-editor.png
