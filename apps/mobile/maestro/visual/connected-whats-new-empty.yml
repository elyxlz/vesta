appId: ${APP_ID}
name: Connected release notes empty state
tags:
  - visual
  - connected
---
- runFlow: prepare-page.yml
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualReleaseNotes=empty"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 30000
- openLink:
    link: "vesta-dev://whats-new?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualReleaseNotes=empty"
- runFlow: wait-for-launch.yml
- takeScreenshot: whats-new-empty
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: whats-new-empty.png

- stopApp
- openLink:
    link: "vesta-dev://agent/aria/settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: '.*Provider and model.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "^Notifications.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true

- tapOn:
    text: "^Notifications.*"
- extendedWaitUntil:
    visible: ".*Design review.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*interrupted.*"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-notification-rules
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-notification-rules.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/details/host-access?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-host-access
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-host-access.png
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/file?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&path=/root/agent/MEMORY.md"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-file-editor
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-file-editor.png
