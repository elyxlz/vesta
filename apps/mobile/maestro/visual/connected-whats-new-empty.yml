appId: ${APP_ID}
name: Connected release notes empty state
tags:
  - visual
  - connected
---
- clearState
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualReleaseNotes=empty"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 30000
- tapOn:
    text: "App settings.*"
- extendedWaitUntil:
    visible: "App Lock"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "What’s new.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
- tapOn:
    text: "What’s new.*"
- extendedWaitUntil:
    visible: "Nothing new yet"
    timeout: 10000
- extendedWaitUntil:
    visible: "What’s new"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: whats-new-empty
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: whats-new-empty.png
