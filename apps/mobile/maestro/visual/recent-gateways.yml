appId: ${APP_ID}
name: Recent gateways and reconnection
tags:
  - visual
  - onboarding
---
- launchApp:
    clearState: true
    permissions:
      camera: deny
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: privacy-initialization-error
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: privacy-initialization-error.png
# The unlock label carries the platform authentication name ("Unlock with
# Face ID" on iOS, "Unlock Vesta" on Android), so the steps match by prefix.
- tapOn:
    text: "Try again"
    waitToSettleTimeoutMs: 1
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: privacy-locked
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: privacy-locked.png
- tapOn:
    text: "Unlock.*"
    waitToSettleTimeoutMs: 1
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: privacy-unlock-error
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: privacy-unlock-error.png
- runFlow: prepare-page.yml
- setPermissions:
    permissions:
      camera: deny
- openLink:
    link: "vesta-dev://connect?visualPrivacy=unlocked"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Recent gateways"
    timeout: 30000
- tapOn:
    text: "Recent gateways"
    waitToSettleTimeoutMs: 1
- takeScreenshot: recent-gateways
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: recent-gateways.png

- tapOn:
    text: "Connect to home.vesta.run"
    point: "50%,50%"
    waitToSettleTimeoutMs: 1
- takeScreenshot: recent-gateway-connecting
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: recent-gateway-connecting.png

- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: recent-gateway-error
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: recent-gateway-error.png

- stopApp
- openLink:
    link: "vesta-dev://agent/aria/settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: '.*Provider and model.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "^Manage backups.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true

- tapOn:
    text: "^Manage backups.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-backups
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-backups.png
