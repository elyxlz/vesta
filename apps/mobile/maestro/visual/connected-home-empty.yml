appId: ${APP_ID}
name: Connected home empty state
tags:
  - visual
  - connected
---
- clearState
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=empty"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Create your agent"
    timeout: 30000
- takeScreenshot: home-empty
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: home-empty.png
