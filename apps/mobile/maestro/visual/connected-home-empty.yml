appId: ${APP_ID}
name: Connected home empty state
tags:
  - visual
  - connected
---
- clearState
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=empty"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: "Create your agent"
    timeout: 30000
- takeScreenshot: home-empty
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: home-empty.png

- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualDashboard=loaded"
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 30000
- tapOn: "Open aria"
- extendedWaitUntil:
    visible: "Done. I prioritized the visual regressions first.*"
    timeout: 10000
# The dashboard renders in a WebView whose inner text Android does not expose to
# the accessibility tree; the harness reveals this native marker on WebView load.
# An emulator can drop a swipe, so the page gesture retries until the marker shows.
- repeat:
    times: 3
    while:
      notVisible: "Dashboard ready"
    commands:
      - swipe:
          start: "85%,25%"
          end: "15%,25%"
          duration: 180
      - extendedWaitUntil:
          visible: "Dashboard ready"
          timeout: 20000
          optional: true
- extendedWaitUntil:
    visible: "Dashboard ready"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-dashboard
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-dashboard.png

- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents&visualReachable=offline"
- extendedWaitUntil:
    visible: "Gateway disconnected. Trying to reconnect."
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: home-gateway-disconnected
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: home-gateway-disconnected.png

- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=loading"
# Android appends the busy state to the content description ("Opening Vesta, busy").
- extendedWaitUntil:
    visible: "Opening Vesta.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: home-loading
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: home-loading.png

- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 30000
- repeat:
    times: 3
    while:
      notVisible: "Open nova"
    commands:
      - swipe:
          start: "85%,25%"
          end: "15%,25%"
          duration: 180
      - extendedWaitUntil:
          visible: "Open nova"
          timeout: 5000
          optional: true
- extendedWaitUntil:
    visible: "Open nova"
    timeout: 5000
- tapOn: "Open nova"
- extendedWaitUntil:
    visible: "Start a conversation"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-chat-empty
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat-empty.png
