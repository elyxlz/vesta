appId: ${APP_ID}
name: Connected app screens
tags:
  - visual
  - connected
---
- runFlow: prepare-page.yml
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: ".*While [Uu]sing.*"
    timeout: 6000
    optional: true
- tapOn:
    text: ".*While [Uu]sing.*"
    optional: true
- extendedWaitUntil:
    visible: ".*[Oo]nly [Ww]hile [Uu]sing.*"
    timeout: 4000
    optional: true
- tapOn:
    text: "Keep Only While Using"
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*Location access.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*Location access.*"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: ".*Turn on.*"
          timeout: 5000
          optional: true
      - tapOn:
          text: ".*Turn on.*"
          optional: true
- runFlow: wait-for-launch.yml
- takeScreenshot: home-agents
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: home-agents.png

- tapOn: "Open aria"
- takeScreenshot: agent-chat
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-chat.png

- repeat:
    times: 3
    while:
      notVisible: "Your dashboard"
    commands:
      - swipe:
          start: "85%,25%"
          end: "15%,25%"
          duration: 180
      - extendedWaitUntil:
          visible: "Your dashboard"
          timeout: 5000
          optional: true
- takeScreenshot: agent-dashboard-empty
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-dashboard-empty.png

# Fresh-launch entry: opening the settings sheet over a live agent screen can
# land it scrolled to its first Compose switch on Android (issue #2105); a
# fresh launch into the deep link lands at the top on both platforms.
- stopApp
- openLink:
    link: "vesta-dev://agent/aria/settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: agent-settings
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-settings.png

- scrollUntilVisible:
    element:
      text: "^Notifications.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true

- tapOn:
    text: "^Notifications.*"
- takeScreenshot: agent-notifications
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-notifications.png
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: "vesta-dev://agent/aria/logs?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
      - runFlow: wait-for-launch.yml
      - takeScreenshot: agent-logs
      - runScript:
          file: capture-screenshot.js
          env:
            SCREENSHOT: agent-logs.png
- openLink:
    link: "vesta-dev://agent/aria/settings"
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: "Close agent settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "^Files.*"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true

- tapOn:
    text: "^Files.*"
- takeScreenshot: agent-files
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: agent-files.png
- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 10000

- tapOn: "Create agent"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: new-agent
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: new-agent.png
# Each sheet gets clean presentation history. Dismissing a preceding form
# sheet can leave Android's next sheet with stale status-bar insets.
- stopApp
- openLink:
    link: "vesta-dev://settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: settings-overview
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-overview.png

# Maestro's default scroll starts at screen center, above the half-height
# iOS sheet. Expand from inside the sheet before looking for its controls.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%,58%"
          end: "50%,10%"
          duration: 500
- scrollUntilVisible:
    element:
      text: "^Dark$"
    direction: DOWN
    timeout: 15000
    centerElement: true
- takeScreenshot: settings-appearance
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-appearance.png
- tapOn: "Dark"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: settings-dark
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-dark.png
- tapOn: "System"
- waitForAnimationToEnd:
    timeout: 1000

# Return to the top before capturing gateway controls.
- stopApp
- openLink:
    link: "vesta-dev://settings?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
# Expand before capturing gateway controls and its full-detent close button.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%,58%"
          end: "50%,10%"
          duration: 500
- waitForAnimationToEnd:
    timeout: 3000

- scrollUntilVisible:
    element:
      text: "Gateway"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- takeScreenshot: settings-gateway
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-gateway.png

- scrollUntilVisible:
    element:
      text: "Devices"
    direction: DOWN
    timeout: 10000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- takeScreenshot: settings-devices
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: settings-devices.png

- stopApp
- openLink:
    link: "vesta-dev://?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- extendedWaitUntil:
    visible: "Open aria"
    timeout: 30000
- openLink:
    link: "vesta-dev://whats-new?visualPrivacy=unlocked&visualSession=connected&visualRoster=agents"
- runFlow: wait-for-launch.yml
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "^Open$"
    optional: true
    waitToSettleTimeoutMs: 1
- takeScreenshot: whats-new
- runScript:
    file: capture-screenshot.js
    env:
      SCREENSHOT: whats-new.png
