appId: ${APP_ID}
name: Page · Gateway update
tags: [visual, pages]
---
- runFlow: ../visual/prepare-page.yml
- openLink:
    link: "vesta-dev://gateway-update?visualSession=connected&visualRoster=agents&visualPrivacy=unlocked&visualGatewayUpdate=required&visualScroll=page"
- runFlow: ../visual/wait-for-launch.yml
- takeScreenshot: page-gateway-update
- runFlow:
    file: ../visual/capture-page.yml
    env:
      SCREENSHOT: page-gateway-update.png
