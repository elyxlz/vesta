appId: ${APP_ID}
name: Page · What's new
tags: [visual, pages]
---
- runFlow: ../visual/prepare-page.yml
- openLink:
    link: "vesta-dev://whats-new?visualSession=connected&visualRoster=agents&visualPrivacy=unlocked&visualScroll=page"
- runFlow: ../visual/wait-for-launch.yml
- takeScreenshot: page-whats-new
- runFlow:
    file: ../visual/capture-page.yml
    env:
      SCREENSHOT: page-whats-new.png
