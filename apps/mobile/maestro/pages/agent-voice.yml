appId: ${APP_ID}
name: Page · Agent settings · voice
tags: [visual, pages]
---
- runFlow: ../visual/prepare-page.yml
- openLink:
    link: "vesta-dev://agent/aria/details/voice?visualSession=connected&visualRoster=agents&visualPrivacy=unlocked&visualScroll=page"
- runFlow: ../visual/wait-for-launch.yml
- takeScreenshot: page-agent-voice
- runFlow:
    file: ../visual/capture-page.yml
    env:
      SCREENSHOT: page-agent-voice.png
