appId: ${APP_ID}
name: Page · Rename agent
tags: [visual, pages]
---
- runFlow: ../visual/prepare-page.yml
- openLink:
    link: "vesta-dev://agent/aria/details/name?visualSession=connected&visualRoster=agents&visualPrivacy=unlocked"
- runFlow: ../visual/wait-for-launch.yml
- takeScreenshot: page-agent-name
- runScript:
    file: ../visual/capture-screenshot.js
    env:
      SCREENSHOT: page-agent-name.png
