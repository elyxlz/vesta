appId: ${APP_ID}
name: Page · Diagnostics
tags: [visual, pages]
---
- runFlow: ../visual/prepare-page.yml
- openLink:
    link: "vesta-dev://debug?visualSession=connected&visualRoster=agents&visualPrivacy=unlocked&visualScroll=page"
- runFlow: ../visual/wait-for-launch.yml
- takeScreenshot: page-diagnostics
- runFlow:
    file: ../visual/capture-page.yml
    env:
      SCREENSHOT: page-diagnostics.png
