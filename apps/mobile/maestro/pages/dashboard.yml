appId: ${APP_ID}
name: Page · Dashboard
tags: [visual, pages]
---
- runFlow: ../visual/prepare-page.yml
- openLink:
    link: "vesta-dev://agent/aria?visualSession=connected&visualRoster=agents&visualPrivacy=unlocked&visualPage=dashboard&visualDashboard=loaded"
- runFlow: ../visual/wait-for-launch.yml
- takeScreenshot: page-dashboard
- runScript:
    file: ../visual/capture-screenshot.js
    env:
      SCREENSHOT: page-dashboard.png
